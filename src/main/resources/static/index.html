<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGallery</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #60a5fa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827);
            color: var(--text);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 2.5rem;
        }
        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0,0,0,0.25);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #1f2937;
        }
        .card-body {
            padding: 18px;
        }
        .author {
            margin: 0 0 8px;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: bold;
        }
        .text {
            margin: 0;
            line-height: 1.5;
            color: var(--text);
        }
        .loading {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>XGallery</h1>
        <p class="subtitle">최근 업로드된 X 기반 콘텐츠를 갤러리처럼 보여줍니다.</p>
        <div id="gallery" class="grid">
            <div class="loading">콘텐츠를 불러오는 중입니다...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(function () {
            const $gallery = $('#gallery');

            $.getJSON('/api/gallery')
                .done(function (posts) {
                    if (!Array.isArray(posts) || posts.length === 0) {
                        $gallery.html('<div class="loading">표시할 콘텐츠가 없습니다.</div>');
                        return;
                    }

                    $gallery.empty();
                    $.each(posts, function (_, post) {
                        const $card = $('<article>').addClass('card');
                        const $body = $('<div>').addClass('card-body');
                        const $author = $('<p>').addClass('author').text(post.author || '');
                        const $text = $('<p>').addClass('text').text(post.text || '');

                        if (post.imageUrl) {
                            $card.append($('<img>').attr('src', post.imageUrl).attr('alt', post.author || ''));
                        }
                        $body.append($author, $text);
                        $card.append($body);
                        $gallery.append($card);
                    });
                })
                .fail(function (response) {
                    const message = response.responseJSON && response.responseJSON.message
                        ? response.responseJSON.message
                        : 'X 게시물을 불러오지 못했습니다. 토큰과 API 접근 권한을 확인해 주세요.';
                    $gallery.empty().append($('<div>').addClass('loading').text(message));
                    console.error(response);
                });
        });
    </script>
</body>
</html>
