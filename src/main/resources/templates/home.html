<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XGallery</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #090b10; color: #f3f4f6; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        button, input { font: inherit; }
        .app { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
        .sidebar { padding: 28px 18px; background: #10131b; border-right: 1px solid #242936; }
        .brand { margin: 0 0 8px; font-size: 1.55rem; letter-spacing: -0.04em; }
        .account { margin: 0 0 28px; color: #8791a3; font-size: 0.9rem; }
        .logout { color: #aab4c4; text-decoration: none; font-size: 0.85rem; }
        .sidebar-heading { margin: 0 0 12px; color: #828da0; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
        .add-user { display: grid; gap: 8px; margin-bottom: 28px; }
        .add-user input { width: 100%; padding: 11px 12px; color: #f3f4f6; background: #171b25; border: 1px solid #2a3040; border-radius: 9px; outline: none; }
        .add-user input:focus { border-color: #7c6cf2; }
        .add-user button, .lookup-button { padding: 10px 12px; color: white; background: #6c5ce7; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; }
        .lookup-all-button { grid-column: 1 / -1; width: 100%; margin-bottom: 12px; padding: 10px 12px; color: white; background: #6c5ce7; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; }
        .add-user button:hover, .lookup-button:hover, .lookup-all-button:hover { background: #7b6df0; }
        .user-list { display: grid; gap: 8px; }
        .user-entry { padding: 12px; background: #151923; border: 1px solid #252b39; border-radius: 11px; }
        .user-entry h3 { margin: 0 0 9px; font-size: 0.95rem; }
        .user-entry small { display: block; margin-top: 8px; color: #7f899b; }
        .user-actions { display: grid; gap: 7px; }
        .lookup-button { width: 100%; padding: 9px 10px; }
        .delete-user-button { width: 100%; padding: 8px 10px; color: #fecaca; background: #3b2028; border: 1px solid #63313c; border-radius: 8px; cursor: pointer; }
        .delete-user-button:hover { background: #512731; }
        .lookup-button:disabled, .lookup-all-button:disabled { opacity: 0.6; cursor: wait; }
        .empty-users { color: #8b95a7; font-size: 0.9rem; line-height: 1.5; }
        .main { min-width: 0; padding: 38px clamp(20px, 5vw, 64px); }
        .main-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
        .main-header h2 { margin: 0; font-size: 1.65rem; letter-spacing: -0.04em; }
        .status { margin: 0; color: #9aa4b5; font-size: 0.9rem; }
        .status.error { color: #fca5a5; }
        .gallery-posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
        .post-card { position: relative; aspect-ratio: 1; min-width: 0; overflow: hidden; padding: 0; color: inherit; text-align: left; background: #141822; border: 1px solid #252b39; border-radius: 14px; cursor: pointer; transition: transform 150ms ease, border-color 150ms ease; }
        .post-card:hover { transform: translateY(-3px); border-color: #6c5ce7; }
        .post-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .post-card.no-image { display: flex; align-items: stretch; padding: 18px; background: linear-gradient(145deg, #191d2c, #11141c); }
        .post-card.no-image .post-preview { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; overflow: hidden; }
        .post-author { color: #a99eff; font-weight: 700; font-size: 0.88rem; }
        .post-preview-text { display: -webkit-box; overflow: hidden; color: #e3e6ec; font-size: 1.02rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 6; }
        .post-card.has-image .post-card-caption { position: absolute; right: 0; bottom: 0; left: 0; padding: 30px 13px 13px; background: linear-gradient(transparent, rgb(0 0 0 / 85%)); }
        .post-card.has-image .post-preview-text { margin-top: 5px; font-size: 0.82rem; -webkit-line-clamp: 2; }
        .welcome { display: grid; min-height: 50vh; place-content: center; color: #8b95a7; text-align: center; }
        .welcome[hidden] { display: none; }
        .welcome strong { margin-bottom: 8px; color: #e4e7ee; font-size: 1.1rem; }
        .alert { margin-bottom: 18px; padding: 11px 13px; color: #fecaca; background: #3b171d; border: 1px solid #64262e; border-radius: 10px; }
        .alert.success { color: #bbf7d0; background: #153321; border-color: #27633d; }
        dialog { width: min(720px, calc(100% - 32px)); max-height: min(88vh, 900px); padding: 0; overflow: auto; color: #f3f4f6; background: #12151e; border: 1px solid #33394a; border-radius: 16px; }
        dialog::backdrop { background: rgb(0 0 0 / 72%); backdrop-filter: blur(3px); }
        .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 20px; border-bottom: 1px solid #292f3d; }
        .detail-header strong { color: #b3aaff; }
        .close-detail { padding: 7px 11px; color: #d8dbe3; background: #242936; border: 0; border-radius: 8px; cursor: pointer; }
        .detail-content { padding: 20px; }
        .detail-image { display: block; max-width: 100%; max-height: 60vh; margin: 0 auto 18px; border-radius: 10px; object-fit: contain; }
        .detail-text { margin: 0; color: #e6e8ed; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
        .detail-date { margin: 18px 0 0; color: #858fa1; font-size: 0.82rem; }
        @media (max-width: 760px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { padding: 20px; border-right: 0; border-bottom: 1px solid #242936; }
            .brand { margin-bottom: 5px; }
            .account { display: inline-block; margin: 0 12px 18px 0; }
            .user-list { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
            .main { padding: 26px 18px; }
            .gallery-posts { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1 class="brand">XGallery</h1>
        <p class="account"><span th:text="${username}"></span> · <a class="logout" th:href="@{/logout}">로그아웃</a></p>

        <h2 class="sidebar-heading">X 사용자 추가</h2>
        <form class="add-user" th:action="@{/home/x-users}" method="post">
            <input type="text" name="screenName" placeholder="예: twitterdev" aria-label="X 사용자 ID" required>
            <button type="submit">사용자 등록</button>
        </form>

        <h2 class="sidebar-heading">내 메뉴</h2>
        <div class="user-list" th:if="${not #lists.isEmpty(xUsers)}">
            <button class="lookup-all-button" type="button">전체 조회하기</button>
            <section class="user-entry" th:each="xUser : ${xUsers}">
                <h3 th:text="${xUser.screenName}">@username</h3>
                <div class="user-actions">
                    <button class="lookup-button" type="button" th:attr="data-screen-name=${xUser.screenName}">조회하기</button>
                    <form th:action="@{/home/x-users/{profileId}/delete(profileId=${xUser.id})}" method="post"
                          onsubmit="return confirm('이 X 사용자와 저장된 게시물 캐시를 삭제할까요?');">
                        <button class="delete-user-button" type="submit">사용자 삭제</button>
                    </form>
                </div>
                <small>등록일 <span th:text="${#temporals.format(xUser.createdAt, 'yyyy-MM-dd')}"></span></small>
            </section>
        </div>
        <p class="empty-users" th:if="${#lists.isEmpty(xUsers)}">등록한 X 사용자가 없습니다. 사용자를 추가해 주세요.</p>
    </aside>

    <main class="main">
        <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="success alert" th:text="${successMessage}"></div>
        <header class="main-header">
            <h2 id="gallery-title">게시물</h2>
            <p id="gallery-status" class="status" aria-live="polite">왼쪽 메뉴에서 사용자를 선택하고 조회하기를 눌러주세요.</p>
        </header>
        <div id="gallery-posts" class="gallery-posts"></div>
        <div id="gallery-welcome" class="welcome">
            <strong>보고 싶은 X 사용자를 선택하세요</strong>
            <span>조회하기를 누르면 해당 사용자의 최신 게시물을 가져옵니다.</span>
        </div>
    </main>
</div>

<dialog id="post-detail" aria-labelledby="detail-author">
    <div class="detail-header">
        <strong id="detail-author"></strong>
        <button class="close-detail" type="button">닫기</button>
    </div>
    <div class="detail-content">
        <img id="detail-image" class="detail-image" alt="" hidden>
        <p id="detail-text" class="detail-text"></p>
        <p id="detail-date" class="detail-date"></p>
    </div>
</dialog>

<script>
    const galleryStatus = document.getElementById('gallery-status');
    const galleryPosts = document.getElementById('gallery-posts');
    const galleryWelcome = document.getElementById('gallery-welcome');
    const galleryTitle = document.getElementById('gallery-title');
    const detailDialog = document.getElementById('post-detail');
    const lookupButtons = [...document.querySelectorAll('.lookup-button')];
    const lookupAllButton = document.querySelector('.lookup-all-button');
    const allActionButtons = lookupAllButton ? [...lookupButtons, lookupAllButton] : lookupButtons;

    function errorMessage(status) {
        if (status === 429) return 'X API 요청 한도에 도달했습니다. 한도가 초기화된 후 다시 시도해 주세요.';
        if (status === 503) return 'X API 인증 정보가 설정되지 않았습니다. 관리자에게 문의해 주세요.';
        if (status === 502) return 'X API에 연결하지 못했습니다. API 접근 권한과 상태를 확인해 주세요.';
        return `게시물을 불러오지 못했습니다. (HTTP ${status})`;
    }

    function showPostDetail(post) {
        document.getElementById('detail-author').textContent = post.author || '';
        document.getElementById('detail-text').textContent = post.text || '';
        const image = document.getElementById('detail-image');
        image.hidden = !post.imageUrl;
        image.src = post.imageUrl || '';
        const date = document.getElementById('detail-date');
        date.textContent = post.createdAt ? new Date(post.createdAt).toLocaleString() : '';
        detailDialog.showModal();
    }

    function createPostCard(post) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `post-card ${post.imageUrl ? 'has-image' : 'no-image'}`;
        card.setAttribute('aria-label', `${post.author || '게시물'} 상세 보기`);
        card.addEventListener('click', () => showPostDetail(post));

        const preview = document.createElement('div');
        preview.className = post.imageUrl ? 'post-card-caption' : 'post-preview';
        const author = document.createElement('span');
        author.className = 'post-author';
        author.textContent = post.author || '';
        const text = document.createElement('span');
        text.className = 'post-preview-text';
        text.textContent = post.text || '';
        preview.append(author, text);

        if (post.imageUrl) {
            const image = document.createElement('img');
            image.src = post.imageUrl;
            image.alt = '';
            image.loading = 'lazy';
            card.append(image, preview);
        } else {
            card.append(preview);
        }
        return card;
    }

    async function loadGallery(url, title, loadingButton) {
        allActionButtons.forEach(item => { item.disabled = true; });
        loadingButton.textContent = '불러오는 중...';
        galleryTitle.textContent = title;
        galleryStatus.classList.remove('error');
        galleryStatus.textContent = '최신 게시물을 확인하고 있습니다...';
        galleryPosts.replaceChildren();
        galleryWelcome.hidden = true;

        try {
            const response = await fetch(url, {
                headers: { Accept: 'application/json' }
            });
            if (!response.ok) throw new Error(errorMessage(response.status));
            const posts = await response.json();
            if (!Array.isArray(posts)) throw new Error('게시물 응답 형식이 올바르지 않습니다.');

            galleryPosts.replaceChildren(...posts.map(createPostCard));
            galleryStatus.textContent = posts.length ? `게시물 ${posts.length}개` : '저장된 게시물이 없습니다.';
        } catch (error) {
            galleryStatus.classList.add('error');
            galleryStatus.textContent = error instanceof TypeError
                ? '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'
                : error.message;
        } finally {
            allActionButtons.forEach(item => {
                item.disabled = false;
                item.textContent = item === lookupAllButton ? '전체 조회하기' : '조회하기';
            });
        }
    }

    lookupButtons.forEach(button => button.addEventListener('click', () => {
        const screenName = button.dataset.screenName.replace(/^@/, '');
        loadGallery(`/api/gallery?screenName=${encodeURIComponent(screenName)}`, `@${screenName} 게시물`, button);
    }));
    lookupAllButton?.addEventListener('click', () => loadGallery('/api/gallery/all', '전체 게시물', lookupAllButton));
    detailDialog.querySelector('.close-detail').addEventListener('click', () => detailDialog.close());
    detailDialog.addEventListener('click', event => {
        if (event.target === detailDialog) detailDialog.close();
    });
</script>
</body>
</html>
