<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>XGallery 회원가입</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: #111827; border: 1px solid #334155; padding: 32px; border-radius: 16px; width: min(420px, 90vw); box-shadow: 0 18px 45px rgba(0,0,0,0.25); }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; padding: 12px 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; margin-top: 6px; }
        button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #22c55e; color: #04130b; font-weight: bold; cursor: pointer; }
        .alert { margin-bottom: 12px; padding: 10px; border-radius: 10px; background: #450a0a; color: #fecaca; }
        .link { margin-top: 18px; text-align: center; }
        a { color: #93c5fd; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>회원가입</h1>

        <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>

        <form th:action="@{/signup}" th:object="${user}" method="post">
            <label for="username">아이디</label>
            <input id="username" th:field="*{username}" type="text" required>

            <label for="password">비밀번호</label>
            <input id="password" th:field="*{password}" type="password" required>

            <label for="email">이메일</label>
            <input id="email" th:field="*{email}" type="email" required>

            <button type="submit">가입하기</button>
        </form>

        <div class="link">
            <a th:href="@{/login}">로그인으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
