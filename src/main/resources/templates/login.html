<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>XGallery 로그인</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: #111827; border: 1px solid #334155; padding: 32px; border-radius: 16px; width: min(420px, 90vw); box-shadow: 0 18px 45px rgba(0,0,0,0.25); }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input { width: 100%; padding: 12px 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
        button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .alert { margin-bottom: 12px; padding: 10px; border-radius: 10px; }
        .success { background: #052e16; color: #bbf7d0; }
        .error { background: #450a0a; color: #fecaca; }
        .link { margin-top: 18px; text-align: center; }
        a { color: #93c5fd; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>XGallery</h1>

        <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
        <div th:if="${param.error}" class="alert error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="alert success">로그아웃 되었습니다.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" required>

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">로그인</button>
        </form>

        <div class="link">
            <a th:href="@{/signup}">회원가입</a>
        </div>
    </div>
</body>
</html>
