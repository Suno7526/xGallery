spring.application.name=xGallery
server.port=8080

# MySQL 설정
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xgallery?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.xGallery.domain
mybatis.configuration.map-underscore-to-camel-case=true

# X API v2
x.api.base-url=https://api.x.com
x.api.bearer-token=
x.api.max-results=20
