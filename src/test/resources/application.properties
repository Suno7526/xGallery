spring.datasource.url=jdbc:h2:mem:xgallery;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.sql.init.mode=never

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.xGallery.domain
mybatis.configuration.map-underscore-to-camel-case=true

x.api.base-url=https://api.x.com
x.api.bearer-token=test-token
x.api.max-results=20
